apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: confluentinc
  namespace: confluent-operator
spec:
  interval: 1h
  url: https://packages.confluent.io/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: confluent-operator
  namespace: confluent-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: confluent-for-kubernetes
      version: 0.2038.1          # CFK 3.4.0 (supports CP 8.4.x)
      sourceRef: { kind: HelmRepository, name: confluentinc }
  install: { crds: CreateReplace }
  upgrade: { crds: CreateReplace }
  values:
    namespaced: true
    namespaceList: [ confluent ]
