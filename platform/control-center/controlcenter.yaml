# Confluent Control Center (next-gen) with embedded Prometheus + Alertmanager.
# Brokers and controllers push metrics to the Prometheus sidecar (spec.dependencies.metricsClient).
# UI: basic auth – c3-viewer is read-only (restricted role), c3-admin has full rights.
# Passwords: Vault kv/kafka/control-center. Access:
#   kubectl -n confluent port-forward svc/controlcenter 9021:9021   -> https://localhost:9021
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-enterprise-control-center-next-gen:2.7.0
    init: confluentinc/confluent-init-container:3.4.0
  dataVolumeCapacity: 10Gi
  storageClass: { name: premium-rwo }
  tls:
    autoGeneratedCerts: true
  authentication:
    type: basic
    basic:
      secretRef: c3-users
      roles: [ Administrators, Restricted ]
      restrictedRoles: [ Restricted ]
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      authentication:
        type: plain
        jaasConfig: { secretRef: c3-kafka-credentials }
      tls: { enabled: true }
    connect:
      - name: connect
        url: https://connect.confluent.svc.cluster.local:8083
        authentication:
          type: basic
          basic: { secretRef: connect-rest-client }
        tls: { enabled: true }
    prometheusClient:
      url: http://controlcenter.confluent.svc.cluster.local:9090
    alertManagerClient:
      url: http://controlcenter.confluent.svc.cluster.local:9093
  services:
    prometheus:
      image: confluentinc/cp-enterprise-prometheus:2.7.0
      pvc:
        dataVolumeCapacity: 10Gi
    alertmanager:
      image: confluentinc/cp-enterprise-alertmanager:2.7.0
  podTemplate:
    resources:
      requests: { cpu: 500m, memory: 3Gi }
      limits: { memory: 3Gi }
