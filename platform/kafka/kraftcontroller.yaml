apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  replicas: 3
  dataVolumeCapacity: 10Gi
  storageClass: { name: premium-rwo }
  image:
    application: confluentinc/cp-server:8.4.1
    init: confluentinc/confluent-init-container:3.4.0
  tls:
    autoGeneratedCerts: true            # signed by the demo CA in secret ca-pair-sslcerts
  authorization:
    type: simple                        # StandardAuthorizer (ACLs)
    superUsers: [ User:kafka, User:admin ]
  listeners:
    controller:
      tls: { enabled: true }
      authentication:
        type: plain
        jaasConfig: { secretRef: kafka-plain-users }
  dependencies:
    metricsClient:                      # metrics for Control Center (Prometheus sidecar)
      url: http://controlcenter.confluent.svc.cluster.local:9090
  configOverrides:
    jvm: [ -Xms768m, -Xmx768m ]
  podTemplate:
    resources:
      requests: { cpu: 250m, memory: 1536Mi }
      limits: { memory: 1536Mi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector: { matchLabels: { app: kraftcontroller } }
