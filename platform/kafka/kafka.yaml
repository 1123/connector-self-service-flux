# 3 brokers (KRaft). Every listener: SASL_SSL with SASL/PLAIN; the user database is the
# Vault-backed secret kafka-plain-users (CFK reloads it when users are added or changed).
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 3
  dataVolumeCapacity: 20Gi
  storageClass: { name: premium-rwo }
  image:
    application: confluentinc/cp-server:8.4.1
    init: confluentinc/confluent-init-container:3.4.0
  tls:
    autoGeneratedCerts: true
  authorization:
    type: simple
    superUsers: [ User:kafka, User:admin ]
  listeners:
    internal:                            # clients: Connect workers, connectors, ACL sync Job
      tls: { enabled: true }
      authentication:
        type: plain
        jaasConfig: { secretRef: kafka-plain-users }
    replication:
      tls: { enabled: true }
      authentication:
        type: plain
        jaasConfig: { secretRef: kafka-plain-users }
  dependencies:
    kRaftController:
      clusterRef: { name: kraftcontroller }
      controllerListener:
        tls: { enabled: true }
        authentication:
          type: plain
          jaasConfig: { secretRef: kafka-plain-users }
  services:
    kafkaRest:                           # embedded Admin REST v3 – used by CFK for KafkaTopic CRs
      authentication:
        type: basic
        basic:
          secretRef: rest-credentials
          roles: [ Administrators ]
  configOverrides:
    server:
      - auto.create.topics.enable=false
      - default.replication.factor=3
      - min.insync.replicas=2
    jvm: [ -Xms2g, -Xmx2g ]
  podTemplate:
    resources:
      requests: { cpu: "1", memory: 4Gi }
      limits: { memory: 4Gi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector: { matchLabels: { app: kafka } }
