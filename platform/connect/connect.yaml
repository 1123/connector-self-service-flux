# Kafka Connect cluster (2 workers). Workers authenticate as User:connect (SASL/PLAIN over TLS);
# every connector overrides the client principal with its own user (connectorOverridePolicy: Principal
# allows only sasl.jaas.config / sasl.mechanism / security.protocol overrides).
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  replicas: 2
  image:
    # Custom image with the JDBC connector, PostgreSQL driver and IBM MQ source connector
    # (connect-image/Dockerfile, built by scripts/03-build-connect-image.sh).
    application: europe-west3-docker.pkg.dev/solutionsarchitect-01/connector-self-service/cp-server-connect-plugins:8.4.1-1
    init: confluentinc/confluent-init-container:3.4.0
  tls:
    autoGeneratedCerts: true             # REST API served via HTTPS
  authentication:
    type: basic                          # REST API basic auth (used by CFK for Connector CRs)
    basic:
      secretRef: connect-rest-users
      roles: [ admin ]
  groupID: _connect
  internalTopicNames:
    configs: _connect-configs
    offsets: _connect-offsets
    status: _connect-status
  connectorOverridePolicy: Principal
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      authentication:
        type: plain
        jaasConfig: { secretRef: connect-kafka-credentials }
      tls: { enabled: true }
  # Mounted at /mnt/secrets/<secret>/<key>; connectors reference them with
  # ${directory:/mnt/secrets/<secret>:<key>} – the values never appear in Git or the Connect REST API.
  mountedSecrets:
    - secretRef: connector-kafka-credentials
    - secretRef: postgres-credentials
    - secretRef: mq-credentials
  configOverrides:
    server:
      - config.providers=file,directory
      - config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
      - config.providers.directory.class=org.apache.kafka.common.config.provider.DirectoryConfigProvider
      - topic.creation.enable=false        # topics are admin-managed KafkaTopic CRs
    jvm: [ -Xms1g, -Xmx1g ]
  podTemplate:
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { memory: 2Gi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector: { matchLabels: { app: connect } }
