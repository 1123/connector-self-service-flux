apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: postgres-credentials, namespace: postgres }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target: { name: postgres-credentials }
  data:
    - secretKey: admin-password
      remoteRef: { key: postgres/admin, property: password }
    - secretKey: connect-username
      remoteRef: { key: postgres/connect, property: username }
    - secretKey: connect-password
      remoteRef: { key: postgres/connect, property: password }
