apiVersion: v1
kind: ServiceAccount
metadata: { name: vault-reader, namespace: confluent }
---
# Vault Kubernetes auth: ESO requests a token for vault-reader (audience "vault"); Vault role "confluent"
# grants read-only access to the paths this namespace needs (see scripts/06-vault-bootstrap.sh).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: { name: vault, namespace: confluent }
spec:
  provider:
    vault:
      server: https://vault.vault.svc:8200
      path: kv
      version: v2
      caProvider: { type: Secret, name: demo-ca, key: ca.crt }
      auth:
        kubernetes:
          mountPath: kubernetes
          role: confluent
          serviceAccountRef: { name: vault-reader, audiences: [ vault ] }
---
