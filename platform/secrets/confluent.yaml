# Kubernetes Secrets in namespace "confluent", all sourced from Vault (kv mount, KV v2).
#
# Kafka SASL/PLAIN user database for brokers + KRaft controllers. plain-users.json contains the
# platform users (kafka, admin, connect) and one user per connector; plain.txt is the broker identity.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: kafka-plain-users, namespace: confluent }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: kafka-plain-users
    template:
      engineVersion: v2
      data:
        plain-users.json: '{{ . | toJson }}'
        plain.txt: |
          username=kafka
          password={{ .kafka }}
        # Client credentials CFK uses for inter-controller / inter-broker connections.
        plain-interbroker.txt: |
          username=kafka
          password={{ .kafka }}
        # Client credentials of the broker's metrics reporter on the internal listener.
        kafka-server-listener-internal-plain-metrics.txt: |
          username=kafka
          password={{ .kafka }}
  dataFrom:
    - extract: { key: kafka/system-users }
    - extract: { key: kafka/connector-users }
---
# Kafka super user used by the ACL sync Job.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: kafka-admin-credentials, namespace: confluent }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target: { name: kafka-admin-credentials }
  data:
    - secretKey: password
      remoteRef: { key: kafka/system-users, property: admin }
---
# Connect worker identity towards Kafka (CFK jaasConfig format).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: connect-kafka-credentials, namespace: confluent }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: connect-kafka-credentials
    template:
      engineVersion: v2
      data:
        plain.txt: |
          username=connect
          password={{ .connect }}
  data:
    - secretKey: connect
      remoteRef: { key: kafka/system-users, property: connect }
---
# One file per connector (file name = connector name = Kafka principal), mounted into the Connect
# workers at /mnt/secrets/connector-kafka-credentials/ and read via DirectoryConfigProvider.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: connector-kafka-credentials, namespace: confluent }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target: { name: connector-kafka-credentials }
  dataFrom:
    - extract: { key: kafka/connector-users }
---
# Embedded Kafka Admin REST API (used by CFK for KafkaTopic CRs): server user list + client credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: rest-credentials, namespace: confluent }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: rest-credentials
    template:
      engineVersion: v2
      data:
        basic.txt: |
          rest-admin: {{ .password }},Administrators
  data:
    - secretKey: password
      remoteRef: { key: kafka/rest, property: rest-admin }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: rest-client-credentials, namespace: confluent }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: rest-client-credentials
    template:
      engineVersion: v2
      data:
        basic.txt: |
          username=rest-admin
          password={{ .password }}
  data:
    - secretKey: password
      remoteRef: { key: kafka/rest, property: rest-admin }
---
# Connect REST API basic auth: server user list + client credential used by CFK for Connector CRs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: connect-rest-users, namespace: confluent }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: connect-rest-users
    template:
      engineVersion: v2
      data:
        # Kafka's PropertyFileLoginModule format "user: password" – no role suffix,
        # otherwise ",<role>" becomes part of the password.
        basic.txt: |
          connect-admin: {{ .password }}
  data:
    - secretKey: password
      remoteRef: { key: kafka/rest, property: connect-admin }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: connect-rest-client, namespace: confluent }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: connect-rest-client
    template:
      engineVersion: v2
      data:
        basic.txt: |
          username=connect-admin
          password={{ .password }}
  data:
    - secretKey: password
      remoteRef: { key: kafka/rest, property: connect-admin }
---
# Database / queue manager credentials for the connectors (mounted into the Connect workers).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: postgres-credentials, namespace: confluent }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target: { name: postgres-credentials }
  data:
    - secretKey: username
      remoteRef: { key: postgres/connect, property: username }
    - secretKey: password
      remoteRef: { key: postgres/connect, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: mq-credentials, namespace: confluent }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target: { name: mq-credentials }
  data:
    - secretKey: username
      remoteRef: { key: mq/app, property: username }
    - secretKey: password
      remoteRef: { key: mq/app, property: password }
---
# Control Center identity towards Kafka. POC: uses the admin super user, because C3 needs cluster-wide
# read access (all topics, groups, configs) and manages its own internal topics.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: c3-kafka-credentials, namespace: confluent }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: c3-kafka-credentials
    template:
      engineVersion: v2
      data:
        plain.txt: |
          username=admin
          password={{ .admin }}
  data:
    - secretKey: admin
      remoteRef: { key: kafka/system-users, property: admin }
---
# Control Center UI users (Jetty format "user: password,role"). Restricted = read-only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: c3-users, namespace: confluent }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target:
    name: c3-users
    template:
      engineVersion: v2
      data:
        basic.txt: |
          c3-admin: {{ index . "c3-admin" }},Administrators
          c3-viewer: {{ index . "c3-viewer" }},Restricted
  dataFrom:
    - extract: { key: kafka/control-center }
