# File names match what the IBM MQ container expects under /run/secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: mq-credentials, namespace: mq }
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: vault }
  target: { name: mq-credentials }
  data:
    - secretKey: mqAdminPassword
      remoteRef: { key: mq/admin, property: password }
    - secretKey: mqAppPassword
      remoteRef: { key: mq/app, property: password }
