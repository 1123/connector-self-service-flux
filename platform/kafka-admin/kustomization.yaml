apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - topics.yaml
  - acl-sync-job.yaml
configMapGenerator:
  # Content-hashed name: every registry/script change yields a new Job spec, which Flux re-creates
  # (force annotation on the Job) – i.e. the ACL sync runs again.
  - name: kafka-acl-sync
    namespace: confluent
    files: [ connector-registry.yaml, acl-sync.sh ]
