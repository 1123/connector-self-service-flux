# Flux sync objects (pull-only). Applied by scripts/05-github-flux-bootstrap.sh; Flux never writes to Git.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  url: https://github.com/1123/connector-self-service-flux
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/poc
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
